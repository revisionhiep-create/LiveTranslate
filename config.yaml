# LiveTrans Configuration

audio:
  # WASAPI loopback device name (null = default output device)
  device: null
  # Sample rate for capture
  sample_rate: 16000
  # Audio chunk duration in seconds for VAD processing (32ms = Silero VAD native window)
  chunk_duration: 0.032

asr:
  # ASR engine: whisper, funasr, anime-whisper
  asr_engine: "anime-whisper"
  # Model size: tiny, base, small, medium, large-v3
  model_size: "medium"
  # FunASR model: sensevoice-small, funasr-nano-2512, funasr-mlt-nano-2512
  funasr_model: "sensevoice-small"
  # Device: cuda or cpu
  device: "cuda"
  # Compute type: float16, int8_float16, int8
  compute_type: "float16"
  # Language: auto, en, ja, zh, ko, etc.
  language: "ja"
  # VAD mode: silero, energy, disabled
  vad_mode: "energy"
  # VAD threshold (0.0 - 1.0)
  vad_threshold: 0.10
  # Energy threshold for Energy-based mode
  energy_threshold: 0.025
  # Minimum speech duration (seconds) before sending to ASR
  min_speech_duration: 0.40
  # Maximum speech duration (seconds) before forced segmentation
  max_speech_duration: 8.00
  # Silence detection mode: auto or fixed
  silence_mode: "fixed"
  # Silence duration (seconds)
  silence_duration: 0.50
  # Incremental ASR during speech
  incremental_asr: false
  interim_interval: 1.00
  # SenseVoice input padding bucket in seconds (0 = disabled)
  sensevoice_pad_seconds: 0.5
  # faster-whisper input padding bucket in seconds (0 = disabled)
  whisper_pad_seconds: 0.5

translation:
  # Whether to use built-in local Qwen3.5-4B model (no external software/API key needed)
  use_local_qwen: true
  local_model: "Qwen/Qwen3.5-4B"
  # OpenAI-compatible API settings (used when use_local_qwen is false)
  api_base: "http://127.0.0.1:1234/v1"
  api_key: ""
  model: "qwen3.5-4b"
  # Target language for translation
  target_language: "en"
  # Source language hint (auto = detect from ASR)
  source_language: "auto"
  # Context window size (number of recent translations to include)
  context_window: 10
  # Max tokens for translation response
  max_tokens: 256
  # Temperature
  temperature: 0.3
  # Enable streaming output
  streaming: true
  # System prompt template ({source_lang}, {target_lang}, {context} will be replaced)
  system_prompt: |
    You are a real-time subtitle translator. Translate {source_lang} into {target_lang}.
    Rules:
    - Output ONLY one single best translation, nothing else.
    - Never include alternatives, parenthetical options, annotations, or explanations.
    - Keep proper nouns, names, and brand names untranslated.
    - Translate repeated expressions concisely, not mechanically word-for-word.
    - Keep subtitles fluent and natural; avoid overly literal or stiff phrasing.
    - Auto-correct likely ASR errors based on context and common sense.

subtitle:
  # Font family
  font_family: "Microsoft YaHei"
  # Font size
  font_size: 28
  # Font color (hex)
  font_color: "#FFFFFF"
  # Outline color
  outline_color: "#000000"
  # Outline width
  outline_width: 2
  # Subtitle position from bottom (pixels)
  bottom_margin: 80
  # Show original text above translation
  show_original: true
  # Original text font size
  original_font_size: 20
  # Original text color
  original_color: "#CCCCCC"
  # Subtitle display duration (seconds)
  display_duration: 5.0
  # Window opacity (0.0 - 1.0)
  opacity: 0.95
